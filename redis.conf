# redis.conf  (ejemplo comentado, centrado en PERSISTENCIA)
# Arrancar con:  redis-server /ruta/redis.conf

bind 127.0.0.1
port 6379

# ----------------------------------------------------------------------
# PERSISTENCIA RDB (snapshots)
# ----------------------------------------------------------------------
# "save <segundos> <cambios>": guarda un snapshot si en esa ventana de
# tiempo hubo al menos esa cantidad de escrituras. Se pueden encadenar.
save 3600 1
save 300 100
save 60 10000
# Para DESACTIVAR RDB por completo, deja:  save ""

dbfilename dump.rdb        # nombre del snapshot
dir ./                     # carpeta donde se guardan dump.rdb y el AOF
rdbcompression yes         # comprime el RDB (ahorra disco)
stop-writes-on-bgsave-error yes

# ----------------------------------------------------------------------
# PERSISTENCIA AOF (append-only file)
# ----------------------------------------------------------------------
appendonly yes             # yes = activa AOF (durabilidad alta)
appendfilename "appendonly.aof"

# Politica de fsync (cuanto baja a disco):
#   always   -> cada escritura (maxima seguridad, mas lento)
#   everysec -> una vez por segundo (RECOMENDADO: pierdes ~1s como mucho)
#   no       -> lo decide el SO (mas rapido, menos seguro)
appendfsync everysec

# Reescritura automatica del AOF cuando crece (compactacion):
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ----------------------------------------------------------------------
# Combinacion recomendada en produccion: RDB + AOF activos a la vez.
# Redis usa el AOF para recuperar (mas completo) y el RDB para backups.
# ----------------------------------------------------------------------
